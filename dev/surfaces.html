<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hearthside Life - surface lab</title>
  <style>
    :root { --ink: #3b3125; --muted: #7a6c5a; --paper: #fffaf2; --line: #d8cbb6; --accent: #e8a95a; --bg: #e9e2d6; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.35 system-ui, sans-serif; }
    body { display: grid; grid-template-columns: 340px 1fr; height: 100vh; overflow: hidden; }
    #side { overflow-y: auto; background: var(--paper); border-right: 1px solid var(--line); padding: 10px 12px 40px; }
    #main { position: relative; overflow: hidden; }
    #view3d, #sheet, #catalog { position: absolute; inset: 0; }
    #sheet, #catalog { overflow: auto; background: #f4efe6; display: none; }
    #catalog { padding: 12px 16px 40px; }
    h1 { font-size: 15px; margin: 0 0 8px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 6px; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; }
    button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid #b9ab95; background: #fff; color: var(--ink); cursor: pointer; min-height: 32px; }
    button.on { background: var(--accent); border-color: #c98a3e; color: #2a1d0e; }
    .designs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .design { display: flex; gap: 8px; align-items: center; text-align: left; padding: 4px; }
    .design img { width: 44px; height: 44px; border-radius: 6px; flex: none; border: 1px solid #0001; }
    .design .meta { min-width: 0; }
    .design .name { font-weight: 600; font-size: 12px; }
    .design .sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .palettes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .pal { padding: 3px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; }
    .pal img { width: 100%; aspect-ratio: 1; border-radius: 5px; border: 1px solid #0001; }
    #info { position: absolute; left: 8px; bottom: 8px; max-width: calc(100% - 16px); font: 12px ui-monospace, monospace; background: #fffaf2dd; padding: 4px 8px; border-radius: 6px; white-space: pre-wrap; pointer-events: none; }
    .sheetBlock { margin: 14px 18px; }
    .sheetBlock canvas { display: block; image-rendering: pixelated; border: 1px solid #0002; }
    .sheetBlock .cap { font-size: 12px; color: var(--muted); margin: 4px 0; }
    .catDesign { margin: 0 0 16px; }
    .catDesign .title { font-weight: 600; margin-bottom: 4px; }
    .catDesign .title span { font-weight: 400; color: var(--muted); }
    .catGrid { display: flex; flex-wrap: wrap; gap: 8px; }
    .catItem { width: 104px; font-size: 10px; text-align: center; }
    .catItem img { width: 96px; height: 96px; display: block; margin: 0 auto 2px; border-radius: 6px; border: 1px solid #0001; }
    @media (max-width: 820px) {
      body { grid-template-columns: 1fr; grid-template-rows: 55vh 45vh; }
      #side { order: 2; border-right: 0; border-top: 1px solid var(--line); }
      #main { order: 1; }
      #info { font-size: 10px; }
    }
  </style>
</head>
<body>
  <aside id="side"></aside>
  <main id="main">
    <div id="view3d"></div>
    <div id="sheet"></div>
    <div id="catalog"></div>
    <div id="info">loading...</div>
  </main>
  <script type="module" src="./surfaces.ts"></script>
</body>
</html>
