<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hearthside Life - Venue and home lots (dev)</title>
    <style>
      :root { --paper: #fbf6ee; --ink: #2f2a26; --teal: #2f8f83; }
      html, body { margin: 0; height: 100%; background: #e9e4da; color: var(--ink); font: 14px system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #bar { position: fixed; left: 8px; top: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
        background: var(--paper); border-radius: 12px; padding: 8px 10px; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
      body.shot #bar { display: none; }
      #bar a, #bar button { min-height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid #c9bfb1; background: #fff; color: var(--ink);
        cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; font: inherit; }
      #bar a.on { background: var(--teal); border-color: var(--teal); color: #fff; }
      #bar .sep { width: 1px; height: 24px; background: #d6ccbe; margin: 0 4px; }
      #status { margin-left: auto; font-size: 12px; opacity: .85; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="bar"></div>
    <script type="module" src="./venues.ts"></script>
  </body>
</html>
